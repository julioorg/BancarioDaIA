<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Guia independente e informativo sobre eventual dissídio coletivo da CAIXA em 2026.">
  <title>Dissídio Coletivo CAIXA 2026</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/mobile.css">
  <link rel="stylesheet" href="/brand-card.css">
</head>
<body>
  <div id="app" style="font-family:Arial,sans-serif;padding:24px">Carregando…</div>
  <script>
    function getVisitorId() {
      const key = 'bancariodaia_visitor_id';
      let id = localStorage.getItem(key);
      if (!id) {
        id = (window.crypto && window.crypto.randomUUID)
          ? window.crypto.randomUUID().replaceAll('-', '')
          : `${Date.now()}_${Math.random().toString(36).slice(2)}`;
        localStorage.setItem(key, id);
      }
      return id;
    }

    async function trackVisit() {
      try {
        await fetch('/api/visit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          keepalive: true,
          body: JSON.stringify({
            visitor_id: getVisitorId(),
            path: location.pathname,
            referrer: document.referrer || null
          })
        });
      } catch (error) {
        console.debug('Contador de visitas indisponível:', error);
      }
    }

    async function loadVisitorCount() {
      const target = document.getElementById('visitor-count');
      if (!target) return;
      try {
        const response = await fetch('/api/stats', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        target.textContent = new Intl.NumberFormat('pt-BR').format(data.visitors || 0);
      } catch (error) {
        target.textContent = '—';
      }
    }

    (async () => {
      const files = [
        '/part1.html','/part2.html','/part3.html','/part4.html',
        '/part5a.html','/part5b.html','/part6.html','/part7.html','/part8.html'
      ];
      const parts = await Promise.all(files.map(async (file) => {
        const response = await fetch(file, { cache: 'no-store' });
        if (!response.ok) throw new Error(`${file}: HTTP ${response.status}`);
        return response.text();
      }));
      document.getElementById('app').outerHTML = parts.join('');
      await trackVisit();
      await loadVisitorCount();
    })().catch((error) => {
      document.getElementById('app').innerHTML = '<strong>Erro ao carregar o conteúdo.</strong><br>' + error.message;
    });
  </script>
</body>
</html>
