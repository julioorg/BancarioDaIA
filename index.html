<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Guia independente e informativo sobre eventual dissídio coletivo da CAIXA em 2026.">
  <title>Dissídio Coletivo CAIXA 2026</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app" style="font-family:Arial,sans-serif;padding:24px">Carregando…</div>
  <script>
    (async () => {
      const files = [
        '/part1.html','/part2.html','/part3.html','/part4.html',
        '/part5a.html','/part5b.html','/part6.html','/part7.html','/part8.html'
      ];
      const parts = await Promise.all(files.map(async (file) => {
        const response = await fetch(file, { cache: 'no-store' });
        if (!response.ok) throw new Error(`${file}: HTTP ${response.status}`);
        return response.text();
      }));
      document.getElementById('app').outerHTML = parts.join('');
    })().catch((error) => {
      document.getElementById('app').innerHTML = '<strong>Erro ao carregar o conteúdo.</strong><br>' + error.message;
    });
  </script>
</body>
</html>
